metadata:
  version: 1.1.0
  created: '2026-05-13'
  updated: '2026-05-14'
  author: 'PAIML Engineering'
  description: |
    Four named runtime contracts for the `helix-core` crate of
    paiml/helixdb-from-zero. Each contract is asserted at runtime in
    crates/helix-core/src/lib.rs immediately after the HTTP round trip
    against the HelixDB instance, and re-asserted in the demo binary.

    Updated 2026-05-14: aligned to the actual HelixQL queries shipped in
    db/queries.hx — Document is keyed by UNIQUE INDEX Title, so vertex
    identity is title-based; vector embeddings are stored on a separate
    V::DocVec with a DocTitle property that maps back to the source
    vertex.

  references:
    - 'README §Provable contracts'
    - 'db/schema.hx + db/queries.hx — the HelixQL surface under test'
    - 'sibling specs: contracts/valkey-rust-v1.yaml, contracts/duckdb-rust-v1.yaml'

equations:
  vertex_round_trip:
    formula: 'GetDocumentByTitle(InsertDocument(t).Title) ≅ InsertDocument(t)'
    domain: 't ∈ String'
    codomain: 'bool'
    lean_theorem: Theorems.HelixCore.VertexRoundTrip
    postconditions:
      - 'GetDocumentByTitle(t).id == InsertDocument(t).id'
      - 'GetDocumentByTitle(t).Title == t'

  edge_traversal:
    formula: 'after InsertRelated(a, b, k): b ∈ Neighbours(a)'
    domain: 'a, b ∈ DocumentTitle, k ∈ String'
    codomain: 'bool'
    lean_theorem: Theorems.HelixCore.EdgeTraversal
    postconditions:
      - 'Neighbours(a).any(d => d.Title == b)'

  vector_top_k_contains_self:
    formula: 'VectorSearch(v, k)[0].DocTitle == t, k >= 1'
    domain: 't ∈ DocumentTitle, v ∈ Vec<F64>, k ∈ Nat, k >= 1'
    codomain: 'bool'
    lean_theorem: Theorems.HelixCore.VectorTopKContainsSelf
    postconditions:
      - 'VectorSearch(v, k).len() >= 1 after InsertVector(t, v)'
      - 'VectorSearch(v, k)[0].DocTitle == t after InsertVector(t, v)'

  upsert_idempotent:
    formula: 'CountByTitle(t) == 1 after InsertDocument(t) ; InsertDocument(t)'
    domain: 't ∈ String'
    codomain: 'bool'
    lean_theorem: Theorems.HelixCore.UpsertIdempotent
    enforcement: 'UNIQUE INDEX Title on N::Document — second insert returns GRAPH_ERROR'
    postconditions:
      - 'CountByTitle(t) == 1 after two InsertDocument(t) calls'

proof_obligations:
  - type: postcondition
    property: 'Round-trip preserves vertex identity and payload'
    formal: 'GetDocumentByTitle(t).id == InsertDocument(t).id ∧ GetDocumentByTitle(t).Title == t'
    applies_to: vertex_round_trip
  - type: postcondition
    property: 'Edge traversal surfaces the target neighbour'
    formal: 'Neighbours(a).contains(d => d.Title == b) after InsertRelated(a, b, k)'
    applies_to: edge_traversal
  - type: postcondition
    property: 'Vector top-K returns source as top-1 when querying with self'
    formal: 'VectorSearch(v, k)[0].DocTitle == t after InsertVector(t, v)'
    applies_to: vector_top_k_contains_self
  - type: postcondition
    property: 'Duplicate insert leaves exactly one vertex'
    formal: 'CountByTitle(t) == 1'
    applies_to: upsert_idempotent
