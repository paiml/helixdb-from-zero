<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <radialGradient id="bg-glow" cx="640" cy="240" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#36b37e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" fill="#0d1117"/>
  <rect width="1280" height="480" fill="url(#bg-glow)"/>
  <!-- corner accents -->
  <circle cx="40"   cy="40"  r="11" fill="#7c5cff" fill-opacity="0.75"/>
  <circle cx="1240" cy="40"  r="11" fill="#36b37e" fill-opacity="0.75"/>
  <circle cx="40"   cy="440" r="11" fill="#ffab00" fill-opacity="0.75"/>
  <circle cx="1240" cy="440" r="11" fill="#4a9eff" fill-opacity="0.75"/>

  <!-- Title rule + thin headline-bar -->
  <rect x="80" y="60" width="1120" height="4" fill="url(#edge-grad)" opacity="0.75"/>

  <!-- Left half: graph nodes + edges -->
  <g id="graph">
    <line x1="220" y1="180" x2="360" y2="130" stroke="#7c5cff" stroke-width="6" opacity="0.85"/>
    <line x1="220" y1="180" x2="380" y2="280" stroke="#7c5cff" stroke-width="6" opacity="0.85"/>
    <line x1="380" y1="280" x2="540" y2="220" stroke="#36b37e" stroke-width="6" opacity="0.85"/>
    <line x1="380" y1="280" x2="280" y2="380" stroke="#36b37e" stroke-width="6" opacity="0.85"/>
    <line x1="360" y1="130" x2="540" y2="220" stroke="#ffab00" stroke-width="6" opacity="0.85"/>
    <line x1="540" y1="220" x2="500" y2="370" stroke="#4a9eff" stroke-width="6" opacity="0.85"/>
    <circle cx="220" cy="180" r="36" fill="#7c5cff" fill-opacity="0.50" stroke="#b8acff" stroke-width="6"/>
    <circle cx="360" cy="130" r="32" fill="#36b37e" fill-opacity="0.55" stroke="#7ee787" stroke-width="6"/>
    <circle cx="380" cy="280" r="42" fill="#7c5cff" fill-opacity="0.55" stroke="#b8acff" stroke-width="6"/>
    <circle cx="540" cy="220" r="34" fill="#ffab00" fill-opacity="0.55" stroke="#f0c674" stroke-width="6"/>
    <circle cx="280" cy="380" r="30" fill="#4a9eff" fill-opacity="0.55" stroke="#a5d6ff" stroke-width="6"/>
    <circle cx="500" cy="370" r="28" fill="#36b37e" fill-opacity="0.55" stroke="#7ee787" stroke-width="6"/>
  </g>

  <!-- Right half: vector space dots (top-K hits with the query at center) -->
  <g id="vector-space">
    <circle cx="940" cy="240" r="190" fill="none" stroke="#7c5cff" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>
    <circle cx="940" cy="240" r="120" fill="none" stroke="#36b37e" stroke-width="2" stroke-dasharray="6 6" opacity="0.55"/>
    <circle cx="940" cy="240" r="60"  fill="none" stroke="#ffab00" stroke-width="2" stroke-dasharray="6 6" opacity="0.65"/>
    <circle cx="940" cy="240" r="14" fill="#ffab00" fill-opacity="0.85" stroke="#f0c674" stroke-width="4"/>
    <circle cx="900" cy="220" r="10" fill="#ffab00" fill-opacity="0.65" stroke="#f0c674" stroke-width="3"/>
    <circle cx="985" cy="270" r="10" fill="#36b37e" fill-opacity="0.65" stroke="#7ee787" stroke-width="3"/>
    <circle cx="880" cy="280" r="10" fill="#36b37e" fill-opacity="0.65" stroke="#7ee787" stroke-width="3"/>
    <circle cx="1020" cy="200" r="10" fill="#36b37e" fill-opacity="0.65" stroke="#7ee787" stroke-width="3"/>
    <circle cx="830" cy="160" r="9" fill="#7c5cff" fill-opacity="0.55" stroke="#b8acff" stroke-width="3"/>
    <circle cx="1060" cy="320" r="9" fill="#7c5cff" fill-opacity="0.55" stroke="#b8acff" stroke-width="3"/>
    <circle cx="870" cy="340" r="9" fill="#7c5cff" fill-opacity="0.55" stroke="#b8acff" stroke-width="3"/>
    <circle cx="1090" cy="160" r="9" fill="#7c5cff" fill-opacity="0.55" stroke="#b8acff" stroke-width="3"/>
    <circle cx="780" cy="240" r="8" fill="#4a9eff" fill-opacity="0.45" stroke="#a5d6ff" stroke-width="3"/>
    <circle cx="1100" cy="260" r="8" fill="#4a9eff" fill-opacity="0.45" stroke="#a5d6ff" stroke-width="3"/>
    <circle cx="950" cy="120" r="8" fill="#4a9eff" fill-opacity="0.45" stroke="#a5d6ff" stroke-width="3"/>
    <circle cx="950" cy="380" r="8" fill="#4a9eff" fill-opacity="0.45" stroke="#a5d6ff" stroke-width="3"/>
  </g>

  <!-- Bottom rule -->
  <rect x="80" y="416" width="1120" height="4" fill="url(#edge-grad)" opacity="0.75"/>
</svg>
