services:
  helix:
    image: helixdb/helixdb:latest
    container_name: helixdb-from-zero
    restart: unless-stopped
    ports:
      - "6969:6969"
    volumes:
      # Named volume — Docker manages lifecycle. HelixDB persists graph +
      # vector data here; without a volume the index dies with the container.
      - helix_data:/data
      # Mount the schema + queries directory so `helix push` (run inside the
      # container during `make schema`) finds the .hx files the crate
      # depends on (insert_document, get_document, insert_edge, neighbours,
      # vector_search, count_by_id).
      - ./helix:/workspace/helix:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6969/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  helix_data:

# Topology note: this is a single-node HelixDB. Module 5 (operations,
# replication, sharding) lives in compose.cluster.yml — deferred until
# Module 5 content lands.
